<mat-form-field>
  <mat-label>Filtrar</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Pérez" #input>
</mat-form-field>

<div class="mat-shadow-2">
  <table mat-table [dataSource]="dataSource" matSort>

    <ng-container matColumnDef="idCliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let row"> {{row.idCliente}} </td>
    </ng-container>

    <ng-container matColumnDef="nombresCliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> NOMBRES </th>
      <td mat-cell *matCellDef="let row"> {{row.nombresCliente}} </td>
    </ng-container>

    <ng-container matColumnDef="apellidosCliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> APELLIDOS </th>
      <td mat-cell *matCellDef="let row"> {{row.apellidosCliente}} </td>
    </ng-container>

    <ng-container matColumnDef="cedulaCliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> CÉDULA </th>
      <td mat-cell *matCellDef="let row"> {{row.cedulaCliente}} </td>
    </ng-container>

    <ng-container matColumnDef="emailCliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> EMAIL </th>
      <td mat-cell *matCellDef="let row"> {{row.emailCliente}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> ACCIONES </th>
      <td mat-cell *matCellDef="let row">
        <button mat-flat-button (click)="openDialog(row.idCliente)">
          <span>Editar</span>
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-flat-button class="cancel-button" (click)="delete(row.idCliente)">
          <span>Eliminar</span>
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="6">No hay clientes que coincidan con "{{input.value}}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccionar página de clientes"></mat-paginator>

  <button mat-fab style="float: right;" (click)="openDialog()">
    <mat-icon>add</mat-icon>
  </button>
</div>
